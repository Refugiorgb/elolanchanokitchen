<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Olanchano Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7FD;--surface:#FFFFFF;--ink:#0E1F45;--muted:#58668A;--line:#DCE5F4;--blue:#0B3C9E;--blue-2:#1F63D8;--gold:#F4B63A;--gold-ink:#3A2600;--chile:#C9382B;--hero:#0A2A6E;--hero-ink:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07122B;--surface:#0F1E42;--ink:#EAF0FF;--muted:#9AABD3;--line:#1E3163;--blue:#7FA8FF;--blue-2:#4C83F0;--hero:#0B2562}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07122B;--surface:#0F1E42;--ink:#EAF0FF;--muted:#9AABD3;--line:#1E3163;--blue:#7FA8FF;--blue-2:#4C83F0;--hero:#0B2562}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.02em}
.hero{background:var(--hero);color:var(--hero-ink);padding:44px 22px 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--gold) 0 33.3%,#fff 33.3% 66.6%,var(--chile) 66.6%)}
.wrap{max-width:720px;margin:0 auto}
.hero small{display:block;font-weight:600;font-size:15px;opacity:.8;margin-bottom:10px}
.hero h1{font-size:clamp(46px,13vw,84px);line-height:.92;font-weight:800}
.hero h1 span{display:block;font-weight:500;opacity:.9;font-size:.55em;margin-top:8px}
.hero p{margin:18px 0 0;max-width:34ch;opacity:.85}
nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px Figtree,sans-serif;padding:9px 16px;border-radius:99px;cursor:pointer}
nav button[aria-current="true"]{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
main{padding:8px 16px 140px}
section{margin-top:34px}
section>h2{font-size:30px;font-weight:800;color:var(--blue)}
section>.sub{color:var(--muted);margin:4px 0 14px;font-size:15px}
h3.grp{font-size:18px;margin:22px 0 4px;color:var(--ink)}
.item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.item .t{flex:1;min-width:0}
.item h4{margin:0;font:600 17px/1.25 Figtree,sans-serif}
.item p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.item .tag{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--chile)}
.buy{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.price{font:800 20px 'Bricolage Grotesque',sans-serif;color:var(--blue)}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);font:700 22px/1 Figtree;cursor:pointer}
.add:active{transform:scale(.92)}
.qty{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:3px}
.qty button{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.55);font:700 18px/1 Figtree;color:var(--gold-ink);cursor:pointer}
.qty b{min-width:16px;text-align:center}
.big{border-width:2px;border-color:var(--blue-2)}
.tray{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13.5px;color:var(--ink)}
.tray span{background:var(--bg);border-radius:8px;padding:2px 9px}
.note{margin-top:14px;font-size:14.5px;color:var(--muted);background:var(--surface);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 150px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;max-width:696px;margin:0 auto}
.bar button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:18px;background:var(--blue-2);color:#fff;font:600 16px Figtree;padding:16px 20px;box-shadow:0 10px 30px rgba(10,42,110,.35);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,12,30,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:720px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:85vh;overflow:auto}
.panel h2{font-size:26px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--muted);display:block}
.total{display:flex;justify-content:space-between;font:800 24px 'Bricolage Grotesque';margin:18px 0}
.act{display:flex;gap:10px}
.act button{flex:1;padding:14px;border-radius:14px;font:600 15px Figtree;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.act .go{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.empty{color:var(--muted);padding:18px 0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.logo{display:block;width:120px;height:120px;border-radius:50%;margin-bottom:18px;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cta a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px}
.cta a.call{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
footer a{color:var(--blue);font-weight:600}
.langbtn{position:absolute;z-index:5;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font:600 13px Figtree,sans-serif;border-radius:99px;padding:7px 14px;cursor:pointer}
</style>
</head>

en:{intro:"Tan catracho como vos. Handmade baleadas, carne asada and the flavors of Honduras.",call:"Call (408) 596 0952",foot:'Orders or reservations: <a href="tel:+14085960952">(408) 596 0952</a><br>@elolanchanokitchen on Instagram and TikTok<br>Prices in US dollars. Fresh drinks are seasonal.',order:"Your order",total:"Total",clear:"Clear",keep:"Keep ordering",view:"View order",empty:"Nothing here yet. Pick something from the menu.",add:"Add to order",less:"Remove one",more:"Add one",other:"Español"}};
var lang="es";
try{lang=localStorage.getItem("lang")||((navigator.language||"").slice(0,2)=="en"?"en":"es")}catch(e){}
function t(x){return lang=="en"&&EN[x]!=null?EN[x]:x}
function u(k){return UI[lang][k]}
function tray(x){return lang=="en"?x.replace("pollo frito","fried chicken").replace("salchichas","sausages"):x}
var cart={},flat={},tabs=document.getElementById("tabs"),menu=document.getElementById("menu");
function money(n){return "$"+n}
function key(s,i,j){return s+"-"+i+"-"+(j==null?"":j)}
function item(k,it){
 var h='<div class="item'+(it[4]?' big':'')+'" data-k="'+k+'"><div class="t"><h4>'+t(it[0])+'</h4>'+(it[2]?'<p>'+t(it[2])+'</p>':'');
 if(it[4])h+='<div class="tray">'+it[4].map(function(x){return '<span>'+tray(x)+'</span>'}).join('')+'</div>';
 if(it[3])h+='<span class="tag">'+t(it[3])+'</span>';
 return h+'</div><div class="buy"><span class="price">'+money(it[1])+'</span><span class="ctl"></span></div></div>';
}
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){tabs.querySelectorAll("button").forEach(function(b){var on=b.dataset.t===en.target.id;b.setAttribute("aria-current",on);if(on)b.scrollIntoView({inline:"center",block:"nearest"})})}})},{rootMargin:"-30% 0px -60% 0px"});
function build(){
 io.disconnect();menu.innerHTML="";tabs.innerHTML="";
 M.forEach(function(s){
  var h='<section id="'+s.id+'"><h2>'+t(s.n)+'</h2>'+(s.sub?'<div class="sub">'+t(s.sub)+'</div>':'');
  if(s.items)s.items.forEach(function(it,i){var k=key(s.id,i);flat[k]=it;h+=item(k,it)});
  if(s.groups)s.groups.forEach(function(g,gi){h+='<h3 class="grp">'+t(g[0])+'</h3>';g[1].forEach(function(it,i){var k=key(s.id,gi,i);flat[k]=it;h+=item(k,it)})});
  if(s.note)h+='<div class="note">'+t(s.note)+'</div>';
  menu.insertAdjacentHTML("beforeend",h+'</section>');
  var b=document.createElement("button");b.textContent=t(s.n);b.dataset.t=s.id;tabs.appendChild(b);
 });
 document.querySelectorAll("section").forEach(function(x){io.observe(x)});
}
function ctl(k){
 var q=cart[k]||0;
 return q?'<div class="qty"><button data-a="-" data-k="'+k+'" aria-label="'+u("less")+'">−</button><b>'+q+'</b><button data-a="+" data-k="'+k+'" aria-label="'+u("more")+'">+</button></div>'
 :'<button class="add" data-a="+" data-k="'+k+'" aria-label="'+u("add")+'">+</button>';
}
function render(){
 document.querySelectorAll(".item").forEach(function(e){e.querySelector(".ctl").innerHTML=ctl(e.dataset.k)});
 var n=0,tt=0,l="";
 Object.keys(cart).forEach(function(k){var q=cart[k];if(!q)return;var it=flat[k];n+=q;tt+=q*it[1];
  l+='<div class="row"><div>'+t(it[0])+(it[3]?'<small>'+t(it[3])+'</small>':'')+'</div><div class="ctl">'+ctl(k)+'</div><b>'+money(q*it[1])+'</b></div>'});
 document.getElementById("lines").innerHTML=l||'<div class="empty">'+u("empty")+'</div>';
 document.getElementById("tot").textContent=money(tt);
 document.getElementById("cnt").textContent=u("view")+" ("+n+")";
 document.getElementById("sum").textContent=money(tt);
 document.getElementById("bar").hidden=!n;
 if(!n)document.getElementById("sheet").classList.remove("open");
}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=u(e.dataset.i)});
 document.getElementById("lang").textContent=u("other");
 build();render();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.a){var k=b.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+(b.dataset.a=="+"?1:-1));render()}
 else if(b.dataset.t){document.getElementById(b.dataset.t).scrollIntoView()}
});
document.getElementById("lang").onclick=function(){lang=lang=="es"?"en":"es";try{localStorage.setItem("lang",lang)}catch(e){}applyLang()};
document.getElementById("open").onclick=function(){document.getElementById("sheet").classList.add("open")};
document.getElementById("close").onclick=function(){document.getElementById("sheet").classList.remove("open")};
document.getElementById("clear").onclick=function(){cart={};render()};
document.getElementById("sheet").onclick=function(e){if(e.target===this)this.classList.remove("open")};
applyLang();
</script>
